baseURL = 'https://epestr.com'
title = 'Peut Mots'
enableRobotsTXT = true

# Drop these in front matter or via taxonomies later if needed
disableKinds = ['taxonomy', 'term']

[params]
  author = "Austin Shijo"
  description = "The personal website of Austin Shijo: projects, writing, and ongoing explorations."
  email = "austins24@iitk.ac.in"
  github_url = "https://github.com/mTvare6"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Allows raw HTML in markdown — used for the long-form content blocks.
      unsafe = true
  [markup.highlight]
    style = "github-light"
    noClasses = false
    lineNos = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[permalinks]
  blog = "/blog/:slug/"

[taxonomies]
  tag = "tags"
