<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}Home{{ else }}{{ .Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
  <link rel="icon" type="image/png" sizes="128x128" href="{{ "favicon.png" | relURL }}?v=2">
  {{ range .AlternativeOutputFormats -}}
    <link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink | safeURL }}">
  {{ end -}}
  {{ if hugo.IsProduction }}
  <script data-goatcounter="https://epestr.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  {{ end }}
</head>
<body>
<div class="wrap">

{{ partial "masthead.html" . }}

{{ block "main" . }}{{ end }}

{{ partial "footer.html" . }}

</div>
</body>
</html>
