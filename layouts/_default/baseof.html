<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
  <link rel="icon" type="image/png" sizes="256x256" href="{{ "favicon.png" | relURL }}?v=3">
  {{ range .AlternativeOutputFormats -}}
    <link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink | safeURL }}">
  {{ end -}}
  {{ if hugo.IsProduction }}
  <script data-goatcounter="https://epestr.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  {{ end }}
  <script defer src="{{ "site.js" | relURL }}"></script>
</head>
<body>
<div class="wrap">

{{ partial "masthead.html" . }}

{{ block "main" . }}{{ end }}

</div>
</body>
</html>
